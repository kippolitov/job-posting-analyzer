  <meta name="description" content="At Linear, we&#39;re building the product development system for teams and agents. AI is fundamentally changing how software gets built, and we’re shaping the tools this new era requires.

Founded in 2019, Linear has become the platform of choice for more than 30,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products. Today, our team is distributed across North America, Europe, and Australia, and we’re continuing to grow internationally. What unites us is relentless focus, fast execution, and a deep care for software craftsmanship.

Over the past few years, Linear has experienced incredible organic growth and has become the default tool of choice for many of the world’s best product teams. We are now layering a product-led sales motion on top of our existing self-serve business to further accelerate our ambitions and bring the magic of Linear to even more and larger companies. You’ll play an instrumental role in defining our enterprise sales motion, contribute to the future of our product, and help high-impact companies build better software.

Location &amp; work mode

Linear is a remote-first company. This role is open to candidates based in the US and Europe. You can work from anywhere within those regions. We value deep focus and async collaboration, with intentional moments to connect in person through team off-sites, optional co-working, and occasional travel.

What you&#39;ll do

 - Become a product expert and help customers use Linear effectively; assist prospects through the trial and evaluation phase

 - Generate a strong pipeline and exceed quarterly targets

 - Stay up to date with our product offering, industry trends, competitive landscape, and market trends to continuously adapt sales strategies and approaches for maximum impact

 - Build relationships with key stakeholders within accounts; understand client needs deeply, align Linear’s solutions to business objectives + shape decision criteria. Effectively communicate and align our value proposition to decision-makers

 - Be the voice of the customer; advocate for customers by surfacing product or adoption blockers to our product team

 - Help build the foundation and define our enterprise sales process

What we&#39;re looking for

 - 3+ years selling to the enterprise, and 7+ years in a quota-carrying sales role

 - Experience selling a technical product to both engineering and product leadership; bonus if you have experience selling collaboration or project management software

 - SaaS and startup experience; comfortable working and adapting in a fast-paced and flexible environment

 - Ability to understand complex client needs, craft tailored discovery, and drive sales through consultative approaches.

 - Strong written and verbal communication, presentation, and product demonstration skills

 - Highly autonomous with a bias for action. Owner’s mindset to quickly come up to speed on product, market, ICP, and unique differentiators.

What we offer

We&#39;re a small, focused team that cares deeply about the quality of our work and the people we do it with. Here&#39;s what you can expect:

 - Competitive salary and equity

 - Employee-friendly equity terms including early exercise in the US and extended exercise windows

 - Daily meal and coffee stipend on every workday

 - Paid co-working space or desk

 - Health coverage (based on country requirements)

 - 5 weeks paid vacation, plus local statutory holidays

 - 4 months paid parental leave

 - Paid month off after 4 years &amp; every 2 years thereafter

 - Regular team events and off-sites

 - Remote-first with no required commute

Learn how we think and work:

 - A story about our mission: Read Me https://linear.app/readme

 - Our hiring process: How we hire at Linear https://linear.app/now/how-we-hire-at-linear

 - Building our way: Announcing our Series C https://linear.app/blog/building-our-way

 - Sequoia Capital Spotlight: Designing for the Developers https://www.sequoiacap.com/article/linear-spotlight/

 - Building our teams: Why and how we do work trials at Linear https://linear.app/blog/why-and-how-we-do-work-trials-at-linear

 - A video series: Conversations on Quality https://linear.app/quality

 - Read about our recent Series C Fundraise https://linear.app/now/building-our-way and Giving our team liquidity https://linear.app/now/giving-our-team-liquidity-through-linear-s-first-tender-offer

ration or project management software</p></li><li><p style=\"min-height:1.5em\">SaaS and startup experience; comfortable working and adapting in a fast-paced and flexible environment</p></li><li><p style=\"min-height:1.5em\">Ability to understand complex client needs, craft tailored discovery, and drive sales through consultative approaches.</p></li><li><p style=\"min-height:1.5em\">Strong written and verbal communication, presentation, and product demonstration skills</p></li><li><p style=\"min-height:1.5em\">Highly autonomous with a bias for action. Owner’s mindset to quickly come up to speed on product, market, ICP, and unique differentiators.</p></li></ul><p style=\"min-height:1.5em\"><strong>What we offer</strong></p><p style=\"min-height:1.5em\">We're a small, focused team that cares deeply about the quality of our work and the people we do it with. Here's what you can expect:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive salary and equity</p></li><li><p style=\"min-height:1.5em\">Employee-friendly equity terms including early exercise in the US and extended exercise windows</p></li><li><p style=\"min-height:1.5em\">Daily meal and coffee stipend on every workday</p></li><li><p style=\"min-height:1.5em\">Paid co-working space or desk</p></li><li><p style=\"min-height:1.5em\">Health coverage (based on country requirements)</p></li><li><p style=\"min-height:1.5em\">5 weeks paid vacation, plus local statutory holidays</p></li><li><p style=\"min-height:1.5em\">4 months paid parental leave</p></li><li><p style=\"min-height:1.5em\">Paid month off after 4 years &amp; every 2 years thereafter</p></li><li><p style=\"min-height:1.5em\">Regular team events and off-sites</p></li><li><p style=\"min-height:1.5em\">Remote-first with no required commute</p></li></ul><p style=\"min-height:1.5em\"><strong>Learn how we think and work:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A story about our mission: <a target
